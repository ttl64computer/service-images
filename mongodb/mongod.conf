# Reached by Service name inside the cluster; auth is on when
# MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD are set.
net:
  port: 27017
  bindIpAll: true
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Why: ttl64 nodes are small (2 GB); the default takes half the memory.
      cacheSizeGB: 0.25
