# Reached by Service name inside the cluster, and maybe through a public
# load balancer: listen everywhere, always behind the password.
bind * -::*
protected-mode no
port 6379

# Why: ttl64 nodes are small (2 GB); evict instead of failing writes.
maxmemory 256mb
maxmemory-policy allkeys-lru

# A cache on an ephemeral cluster: no snapshots, no append-only file.
save ""
appendonly no

# The entrypoint adds `requirepass` from REDIS_PASSWORD.
include /run/redis/auth.conf
