version: 2
updates:
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(nginx)"
  - package-ecosystem: docker
    directory: /postgres
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(postgres)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /mysql
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(mysql)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /redis
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(redis)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /mongodb
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(mongodb)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
