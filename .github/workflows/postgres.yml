name: postgres

on:
  push:
    branches: [main]
    paths:
      - postgres/**
      - .github/workflows/postgres.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - postgres/**
      - .github/workflows/postgres.yml
      - .github/workflows/build-image.yml
  schedule:
    # Weekly rebuild for OS patches.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: postgres
