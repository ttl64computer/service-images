<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nginx on ttl64</title>
    <style>
      :root { color-scheme: light dark; --ink: #0b0b0c; --muted: #6b6b70; --bg: #f7f7f5; --line: #e7e7e3; }
      @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f0; --muted: #9a9aa0; --bg: #0f0f10; --line: #26262a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
             background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 520px; }
      .mark { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.02em; color: var(--muted); }
      h1 { margin: 12px 0 8px; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 0 0 16px; color: var(--muted); }
      pre { margin: 0; padding: 14px 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px;
            font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">ttl64 · nginx</div>
      <h1>nginx is running.</h1>
      <p>This is the default page of the ttl64 nginx image. Serve your own files by mounting them over
        <code>/usr/share/nginx/html</code>, or build from this image:</p>
      <pre>FROM ghcr.io/ttl64computer/nginx
COPY ./site /usr/share/nginx/html</pre>
    </main>
  </body>
</html>
