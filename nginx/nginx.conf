user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Why: HTTP endpoints on ttl64 come through Cloudflare; log the visitor's address next to the proxy's.
    log_format main '$remote_addr $http_cf_connecting_ip - [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
